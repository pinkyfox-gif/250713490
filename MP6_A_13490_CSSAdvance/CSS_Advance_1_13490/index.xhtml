<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>Pendaftaran Data Mahasiswa Baru</title>
    </head>
    <body>
        <h1>Pendaftaran Data Mahasiswa Baru</h1>
        <form action="" method="post" enctype="multipart/form-data">
            <table cellpadding="4" cellspacing="2" border="1" style="border-collapse:collapse; width:100%;">

                <tr>
                    <td>
                        <label for="namamhs"><strong>Nama Mahasiswa</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="namamhs" name="namamhs" size="30"/>
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Jenis Kelamin</strong>
                    </td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-Laki"/><label for="laki">Laki-Laki</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan"/><label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="prodi"><strong>Program Studi</strong>
                        </label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="email"><strong>Alamat Email</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="email" name="email" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="telepon"><strong>Nomor Telepon</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="password"><strong>Password</strong>
                        </label>
                    </td>
                    <td>
                        <input type="password" id="password" name="password" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="photo"><strong>Photo</strong>
                        </label>
                    </td>
                    <td>
                        <input type="file" id="photo" name="photo" size="18" accept="image/gif, image/jpeg, image/png" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="namasmu"><strong>Nama Asal Sekolah</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="namasmu" name="namasmu" size="18" />
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: top;"><strong>Hal Favorit</strong>
                    </td>
                    <td>
                        <p>
                            <strong>Musik</strong><br />
                            <input type="checkbox" id="musik1" name="musik" value="Pop"/>
                            <label for="musik1">Pop</label>
                            <input type="checkbox" id="musik2" name="musik" value="Rock"/>
                            <label for="musik2">Rock</label>
                            <input type="checkbox" id="musik3" name="musik" value="Jazz"/>
                            <label for="musik3">Jazz</label>
                        </p>
                        <p>
                            <strong>Film</strong><br />
                            <input type="checkbox" id="film1" name="film" value="Drama"/>
                            <label for="film1">Drama</label>
                            <input type="checkbox" id="film2" name="film" value="Action"/>
                            <label for="film2">Action</label>
                            <input type="checkbox" id="film3" name="film" value="Sci-Fi"/>
                            <label for="film3">Sci-Fi</label>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: top;">
                        <label for="resume">
                            <strong>Resume</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="resume" name="resume" rows="10" cols="23"></textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="simpan" value="Kirim Data"/>
                    </td>
                </tr>
        </table>
    </form>
</body>
</html>
