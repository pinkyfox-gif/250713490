<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Informasi Mahasiswa</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        type="text/javascript"></script>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            text-align: center;
            padding: 40px;
        }
        #kartu {
            width: 250px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid #cccccc;
            border-radius: 10px;
            transition: 0.3s;
        }
        #kartu h2 {
            color: #333333;
        }
        #kartu p {
            color: #666666;
        }
    </style>
    <script type="text/javascript">
        //<![CDATA[
            $(document).ready(function() {
                // 1. Pilih elemen dengan id "kartu" dan gunakan event hover()
                $("#kartu").hover(
                    // 2. Fungsi ketika mouse diarahkan ke kartu
                    function() {
                        // 3. Ubah background, border, dan ukuran kartu
                        $(this).css({
                            "background-color": "#d1ffd1",
                            "border-color": "green",
                            "transform": "scale(1.05)"
                        });
                        // 4. Ubah teks petunjuk
                        $("#status").text("Mouse berada di atas kartu!");
                    },
                    // 5. Fungsi ketika mouse meninggalkan kartu
                    function() {
                        // 6. Kembalikan tampilan kartu
                        $(this).css({
                            "background-color": "white",
                            "border-color": "#cccccc",
                            "transform": "scale(1)"
                        });
                        // 7. Kembalikan teks petunjuk
                        $("#status").text("Arahkan mouse ke kartu!");
                    }
                );
            });
        //]]>
    </script>
</head>

<body>
    <h1>Informasi Mahasiswa</h1>

    <p id="status">Arahkan mouse ke kartu!</p>

    <div id="kartu">
        <h2>Informasi Data Mahasiswa</h2>
        <p>Nama : Trifosa Marselia Perapi</p>
        <p>Program Studi : Informatika</p>
        <p>Universitas Atma Jaya Yogyakarta</p>
    </div>
</body>
</html>
