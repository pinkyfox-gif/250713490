        <div class="cart-box">
            <h3>Keranjang Kamu</h3>

            <?php if (empty($_SESSION['cart'])): ?>
                <p style="color: var(--muted); text-align: center; margin-top: 20px;">Wah, keranjangmu masih kosong nih.<br>Silakan pilih produk yang tersedia terlebih dahulu!</p>
            <?php else: ?>

                <?php foreach ($_SESSION['cart'] as $id => $qty): ?>
                    <?php
                        $namaProduk = '';
                        $hargaProduk = 0;
                        foreach ($produk as $p) {
                            if ($p['id'] == $id) {
                                $namaProduk = $p['nama'];
                                $hargaProduk = $p['harga'];
                                break;
                            }
                        }
                    ?>
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <p><?= htmlspecialchars($namaProduk) ?></p>
                            <span>Rp <?= number_format($hargaProduk * $qty, 0, ',', '.') ?></span>
                        </div>

                        <div class="qty-form">
                            <form method="POST" style="display:inline;">
                                <input type="hidden" name="id" value="<?= $id ?>">
                                <input type="hidden" name="action" value="minus">
                                <button type="submit" name="update_qty" class="qty-btn">-</button>
                            </form>

                            <span><?= $qty ?></span>

                            <form method="POST" style="display:inline;">
                                <input type="hidden" name="id" value="<?= $id ?>">
                                <input type="hidden" name="action" value="plus">
                                <button type="submit" name="update_qty" class="qty-btn">+</button>
                            </form>

                            <form method="POST" style="display:inline;">
                                <input type="hidden" name="id" value="<?= $id ?>">
                                <button type="submit" name="remove_item" class="btn-remove">Hapus</button>
                            </form>
                        </div>
                    </div>
