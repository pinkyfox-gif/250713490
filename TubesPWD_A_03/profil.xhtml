    <style type="text/css">
        /* ===== Background area foto profil ===== */
        .profile-photo-wrap {
            background: linear-gradient(135deg, #fff3e3 0%, #fbdcb8 100%);
            border: 1px solid #efd3b0;
            border-radius: 18px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(196, 122, 69, 0.12);
        }

        /* ===== Border foto profil bertema roti ===== */
        .avatar-wrap {
            position: relative;
            width: 104px;
            height: 104px;
            margin: 14px;
            flex-shrink: 0;
        }

        /* Cincin gradasi warna kerak roti */
        .avatar-wrap::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: conic-gradient(#e8b66f, #c47a45, #f3d19c, #b86a38, #e8b66f);
            box-shadow: 0 4px 12px rgba(139, 80, 40, 0.35);
        }

        /* Garis putus-putus seperti taburan di cincin */
        .avatar-wrap::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 250, 243, 0.85);
        }

        /* Foto / huruf inisial di tengah cincin */
        .avatar-wrap .profile-photo,
        .avatar-wrap .profile-photo-placeholder {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 88px;
            height: 88px;
            margin: 0;
            box-sizing: border-box;
            border-radius: 50%;
            border: 3px solid #fffaf3;
            z-index: 1;
        }

        .avatar-wrap .profile-photo {
            object-fit: cover;
            display: block;
        }

        .avatar-wrap .profile-photo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5e1d0;
        }

        /* Roti di sekeliling border */
        .roti {
            position: absolute;
            font-size: 22px;
            line-height: 1;
            z-index: 2;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
            animation: floatRoti 3s ease-in-out infinite;
        }
        .roti-1 { top: -12px;    left: 50%; margin-left: -11px; }
        .roti-2 { right: -12px;  top: 50%;  margin-top: -11px;  animation-delay: 0.5s; }
        .roti-3 { bottom: -12px; left: 50%; margin-left: -11px; animation-delay: 1s; }
        .roti-4 { left: -12px;   top: 50%;  margin-top: -11px;  animation-delay: 1.5s; }

        @keyframes floatRoti {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50%      { transform: translateY(-3px) rotate(6deg); }
        }
    </style>
</head>
