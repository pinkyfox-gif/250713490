<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>If-Else Internal: Tiket Bioskop</title>
    <meta http-equiv="content-type" content-="text-html; charset-utf-8" />
    <script type="text/javascript">
        var iUmur;
        var sMember;

        iUmur = prompt("Masukkan Umur Anda.", 0);
        sMember = prompt("Apakah Anda Member? (Y)a atau (T)idak", "Y");

        if (iUmur > 17){
            if (sMember == "Y") {
                alert("Tiket Dewasa Member: Rp 30.000");
            }else{
                alert("Tiket Dewasa Umum: Rp 40.000");
            }
        }else{
            if (sMember == "Y"){
                alert("Tiket Anak Member: Rp 15.000");
            }else{
                alert("Tiket Anak Umum: Rp 20.000");
            }
        }
    </script>
</head>

<body>
    <h1>If-Else Internal: Tiket Bioskop</h1>
    <p>Reload Halaman Untuk Mencoba Lagi</p>
</body>

</html>
