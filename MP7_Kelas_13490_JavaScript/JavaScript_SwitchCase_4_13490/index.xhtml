<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>If-Else Eksternal: Kelulusan</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        var sinput;

        sInput = prompt("Pilih Menu : (N)asi Goreng, (M)ie Ayam, (B)akso, (E)s Teh", "N");

        switch (sInput) {
            case "N":
                alert("Anda Memilih Nasi Goreng");
                break;
            case "M":
                alert("Anda Memilih Mie Ayam");
                break;
            case "B":
                alert("Anda Memilih Bakso");
                break;
            case "E":
                alert("Anda Memilih Es Teh");
                break;
            default:
                alert("Menu Tidak Tersedia");
        }
    </script>
</head>

<body>
<h1>switch-Case: Menu Kantin</h1>
<p>Reload halaman untuk mencoba lagi .< /p>
</body>

</html>
